org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true
MAPBOX_DOWNLOADS_TOKEN=YOUR_KEY_HERE
# Android Lint's K2 UAST frontend cannot analyse the shared Kotlin core, which is symlinked in at src/main/kotlin/com/mapspeople/mapsindoors/core: it follows the link, resolves the files to their canonical path under AndroidCore/ outside the module, and lintVitalAnalyzeRelease aborts with "Cannot find a KaModule for the VirtualFile". Only release builds run lintVital, so `flutter build apk` fails while every debug build and local check passes. Selecting the older lint frontend avoids it and keeps lint running.
# The alternative - naming the core by its canonical path - needs the symlink moved out of the src/main/kotlin source root, which Flutter forbids: it derives the plugin main class path from `package:` in pubspec.yaml and fails with "doesn't have a main class defined" before Gradle runs.
# This example needs the flag for the same reason the harness apps do: pubspec_overrides.yaml resolves the plugin by path, so the example compiles the symlinked core itself.
# It is inert in the published package: push.sh deletes example/pubspec_overrides.yaml and copies with `cp -RL`, so a consumer's copy resolves the plugin from pub and sees a real directory rather than a symlink. If a future AGP drops this flag, check whether the symlink works again before reaching for a workaround.
android.lint.useK2Uast=false
